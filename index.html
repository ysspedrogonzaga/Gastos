<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Gastos — Pedro Jota</title>
<link rel="preload" href="fonts/NeueMontreal-Light.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/NeueMontreal-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:'Neue Montreal';src:url('fonts/NeueMontreal-Light.ttf') format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'Neue Montreal';src:url('fonts/NeueMontreal-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Neue Montreal';src:url('fonts/NeueMontreal-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}

:root{
  --paper:#E6E7EA;--card:#FAFAFA;--card-2:#EEEFF1;--ink:#000;
  --on-ink:#F5F5F3;--on-ink-2:rgba(245,245,243,.6);--on-ink-3:rgba(245,245,243,.36);
  --t1:#000;--t2:rgba(0,0,0,.56);--t3:rgba(0,0,0,.34);--line:rgba(0,0,0,.08);
  --pos:#0B8A5A;--neg:#D3343C;--pos-i:#4BD69B;--neg-i:#FF6F70;
  --total-fill:rgba(128,128,128,.24);
  --r-l:28px;--gap:8px;--pad:28px;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media(prefers-color-scheme:dark){:root{
  --paper:#0B0C0E;--card:#17181B;--card-2:#232428;
  --t1:#F3F3F1;--t2:rgba(243,243,241,.58);--t3:rgba(243,243,241,.32);--line:rgba(255,255,255,.08);
  --pos:#4BD69B;--neg:#FF6F70;
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Neue Montreal','Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:400;font-size:16px;line-height:1.45;letter-spacing:-.005em;background:var(--paper);color:var(--t1);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;padding-bottom:128px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--t1);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* topo */
.top{max-width:1296px;margin:0 auto;padding:22px 24px 0;display:flex;justify-content:space-between;align-items:baseline}
.wordmark{font-size:20px;letter-spacing:-.025em}
.who{font-size:15px;color:var(--t2)}
.main{max-width:1296px;margin:0 auto;padding:0 24px}
.page{display:none}.page.active{display:block}

/* display, fora dos cards */
.disp{display:grid;grid-template-columns:1fr minmax(0,380px);align-items:end;gap:20px 48px;padding:clamp(44px,8vw,112px) 0 clamp(28px,4vw,48px)}
.disp h1{font-weight:300;font-size:clamp(76px,14.5vw,216px);line-height:.84;letter-spacing:-.058em;margin-left:-.05em}
.mask{display:block;overflow:hidden;padding-bottom:.14em;margin-bottom:-.14em}
.mask-in{display:block}
.disp p{font-size:clamp(17px,1.45vw,20px);line-height:1.38;color:var(--t2);max-width:36ch;padding-bottom:.5em}
@media(max-width:760px){.disp{grid-template-columns:1fr}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.stack > .c:last-child{flex:1}
.fill{display:flex;flex-direction:column}
.fill .chart{margin-top:auto}
@media(max-width:1060px){.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 12}}
@media(max-width:620px){.s3,.s6{grid-column:span 12}:root{--pad:22px;--r-l:24px}.main,.top{padding-left:16px;padding-right:16px}.hero{min-height:400px}.status{min-height:0}.status .big-m{margin-top:28px}.metric{min-height:176px}}

.c{position:relative;border-radius:var(--r-l);padding:var(--pad);min-width:0;container-type:inline-size}
.c-w{background:var(--card);color:var(--t1)}
.c-b{background:var(--ink);color:var(--on-ink);--t1:var(--on-ink);--t2:var(--on-ink-2);--t3:var(--on-ink-3);--line:rgba(255,255,255,.1);--pos:var(--pos-i);--neg:var(--neg-i)}
@media(prefers-color-scheme:dark){.c-b{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}}

.lbl{font-size:15px;color:var(--t2)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ch h2{font-size:24px;font-weight:400;letter-spacing:-.025em;line-height:1.15}
.sub{font-size:15px;color:var(--t2);margin-top:4px;line-height:1.4}

/* números grandes: R$ e centavos em sobrescrito */
.big,.num,.big-m{font-weight:300;letter-spacing:-.05em;line-height:.9;white-space:nowrap;font-feature-settings:'tnum' 1}
.big{font-size:clamp(60px,16.5cqi,176px)}
.num{font-size:clamp(40px,18cqi,72px)}
.big-m{font-size:clamp(72px,32cqi,148px)}
.m-cur,.m-dec{font-size:.36em;letter-spacing:-.01em;position:relative;top:-1.18em}
.m-cur{margin-right:.16em;font-weight:400}
.m-dec{color:var(--t2);margin-left:.03em}
.pct{font-size:.38em;position:relative;top:-1.1em;margin-left:.06em;letter-spacing:0}

/* variações */
.pos{color:var(--pos)}.neg{color:var(--neg)}.neu{color:var(--t2)}
.dl{font-size:15px;line-height:1.35;display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:1.35em}
.tri{display:inline-block;width:0;height:0;border-left:.34em solid transparent;border-right:.34em solid transparent;margin-right:.3em;vertical-align:.1em}
.tri.up{border-bottom:.54em solid currentColor}.tri.dn{border-top:.54em solid currentColor}
.dc{font-size:13px;display:inline-flex;align-items:center;white-space:nowrap}

/* gradiente animado */
.grad{overflow:hidden;isolation:isolate}
.glow{position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;overflow:hidden}
.glow i{position:absolute;inset:0;transition:opacity 1.4s var(--ease)}
.glow i::before,.glow i::after{content:'';position:absolute;border-radius:50%;filter:blur(56px);will-change:transform}
.gp{background:linear-gradient(180deg,#000 30%,#0B161B 62%,#20343C 100%)}
.gp::before{width:95%;height:80%;left:-18%;bottom:-48%;background:radial-gradient(closest-side,#5B7C86,rgba(91,124,134,0));animation:driftA 17s ease-in-out infinite alternate}
.gp::after{width:75%;height:62%;right:-14%;bottom:-44%;background:radial-gradient(closest-side,#C5CED2,rgba(197,206,210,0));opacity:.85;animation:driftB 23s ease-in-out infinite alternate}
.gn{background:linear-gradient(180deg,#000 30%,#1A0A0C 62%,#3E1A1F 100%)}
.gn::before{width:95%;height:80%;left:-18%;bottom:-48%;background:radial-gradient(closest-side,#8A3A40,rgba(138,58,64,0));animation:driftA 17s ease-in-out infinite alternate}
.gn::after{width:75%;height:62%;right:-14%;bottom:-44%;background:radial-gradient(closest-side,#D9AAA6,rgba(217,170,166,0));opacity:.7;animation:driftB 23s ease-in-out infinite alternate}
.grad .gn{opacity:0}.grad.is-neg .gn{opacity:1}.grad.is-neg .gp{opacity:0}
.hero.is-neg .big{color:var(--neg)}
@keyframes driftA{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(22%,-10%,0) scale(1.15)}100%{transform:translate3d(38%,-2%,0) scale(.95)}}
@keyframes driftB{0%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-26%,-12%,0) scale(.9)}100%{transform:translate3d(-10%,-20%,0) scale(1.12)}}

/* hero do mês */
.hero{min-height:460px;display:flex;flex-direction:column;gap:16px}
.hero .big{margin-top:auto}
.hero .dl{font-size:17px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{font-size:13px;padding:6px 12px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line);color:var(--t2);white-space:nowrap}
.comp-wrap{position:relative;margin-top:10px}
.comp{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}
.comp i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s var(--ease)}
.cp-f{background:#8E979C}.cp-c{background:var(--on-ink)}.cp-s{background:var(--pos)}
.comp-mark{position:absolute;top:-4px;height:20px;width:2px;margin-left:-1px;border-radius:2px;background:var(--neg);transition:left 1.1s var(--ease)}
.comp-leg{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;font-size:14px;color:var(--t2)}
.comp-leg span{display:inline-flex;align-items:center;gap:8px}
.comp-leg b{font-weight:400;color:var(--t1)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* status de pagamentos */
.status{display:flex;flex-direction:column;gap:18px;min-height:460px}
.status .big-m{margin-top:auto}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.14);transition:background .5s var(--ease)}
.segs i.on{background:var(--on-ink)}
.status-txt{font-size:clamp(20px,7cqi,26px);line-height:1.22;letter-spacing:-.02em}
.status-info{font-size:15px;color:var(--t2)}

/* métricas */
.metric{display:flex;flex-direction:column;gap:12px;min-height:236px}
.metric .num{margin-top:auto;padding-top:12px}
.metric .dl{font-size:14px}
.split{display:flex;flex-direction:column;font-size:14px;color:var(--t2)}

/* linhas editáveis */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);min-height:60px}
.rows .row:first-child{border-top:none}
.row-label{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:16px;transition:color .4s}
.row-right{display:flex;align-items:center;gap:14px;flex:none}
.row-val{font-size:18px;font-weight:300;letter-spacing:-.01em;white-space:nowrap;transition:color .4s}
.row.paid .row-label,.row.paid .row-val{color:var(--t3)}
.row-total{border-top:none;background:var(--total-fill);border-radius:16px;padding:14px 16px;margin:10px -8px 0;min-height:0}
.row-total .row-val{font-size:22px}
.tag{font-size:12px;line-height:1;padding:5px 9px;border-radius:99px;white-space:nowrap;color:var(--t2)}
.tag-auto{background:var(--card-2)}
.tag-rep{box-shadow:inset 0 0 0 1px var(--line)}
.in{width:8.4em;text-align:right;font-size:18px;font-weight:300;letter-spacing:-.01em;background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 2px;border-radius:0;transition:border-color .25s}
.in:hover{border-bottom-color:var(--t3)}
.in:focus{outline:none;border-bottom-color:var(--t1)}
.in::placeholder{color:var(--t3)}

.chk{display:inline-flex;align-items:center;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;width:24px;height:24px;margin:0;cursor:pointer}
.box{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--t3);display:grid;place-items:center;transition:background .3s var(--ease),box-shadow .3s}
.box svg{width:14px;height:14px;fill:none;stroke:var(--card);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .35s var(--ease) .05s}
.chk input:checked + .box{background:var(--t1);box-shadow:none}
.chk input:checked + .box svg{stroke-dashoffset:0}
.chk input:focus-visible + .box{outline:2px solid var(--t1);outline-offset:3px}

/* fatura */
.fatura .num{margin-top:4px}
.cats{margin-top:24px}
.cat{border-top:1px solid var(--line)}
.cat-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;background:none;border:0;cursor:pointer;text-align:left}
.cat-name{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;font-size:16px}
.cat-share{display:block;height:3px;border-radius:99px;background:var(--card-2);max-width:200px;overflow:hidden}
.cat-share i{display:block;height:100%;background:var(--t1);border-radius:99px}
.cat-right{display:flex;align-items:center;gap:14px;flex:none}
.cat-val{font-size:18px;font-weight:300;letter-spacing:-.01em;white-space:nowrap}
.cat-chev{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);transition:transform .45s var(--ease),background .25s}
.cat-chev svg{width:12px;height:12px;fill:none;stroke:var(--t1);stroke-width:1.6;transition:stroke .25s}
.cat-chev.open{transform:rotate(180deg)}
@media(hover:hover){.cat-row:hover .cat-chev{background:var(--t1)}.cat-row:hover .cat-chev svg{stroke:var(--card)}}
.cat-items{height:0;overflow:hidden}
.cat-items-in{padding:0 0 14px}
.cat-item{display:flex;justify-content:space-between;gap:16px;padding:7px 0 7px 14px;font-size:14px;color:var(--t2);border-left:1px solid var(--line)}
@media(max-width:620px){.cat-right .dc{display:none}}

/* gráficos */
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:'Neue Montreal','Helvetica Neue',Arial,sans-serif}
.radial{max-width:360px;margin:4px auto 0}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:22px}
.leg-i{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.leg-i .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg-i .p{color:var(--t2)}
.swp{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
@container (max-width:440px){.leg{grid-template-columns:1fr}}
.legrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--t2);margin-top:8px}
.legrow span{display:inline-flex;align-items:center;gap:8px}

/* toggle segmentado */
.segctl{position:relative;display:inline-flex;padding:5px;border-radius:99px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.segctl button{position:relative;z-index:1;padding:11px 22px;border-radius:99px;background:none;border:0;cursor:pointer;color:var(--on-ink-2);font-size:15px;white-space:nowrap;transition:color .3s}
.segctl button.on{color:#000}
.seg-ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:99px;background:#F7F7F5}

/* histórico */
.tbl-wrap{overflow-x:auto;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{text-align:right;font-weight:400;font-size:14px;color:var(--t2);padding:0 0 14px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:16px 0;border-top:1px solid var(--line);font-size:17px;font-weight:300;white-space:nowrap}
.tbl td:first-child{font-weight:400;font-size:16px}
.sob{display:inline-flex;align-items:center;gap:10px}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;font-weight:400;font-size:15px}
.pill.pos{background:color-mix(in srgb,var(--pos) 14%,transparent)}
.pill.neg{background:color-mix(in srgb,var(--neg) 14%,transparent)}

/* dock de navegação */
.dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;border-radius:99px;background:rgba(26,27,30,.74);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 14px 36px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.08)}
.dock::-webkit-scrollbar{display:none}
.dock-in{position:relative;display:flex;padding:6px}
.dock-btn{position:relative;z-index:1;padding:11px 18px;border:0;border-radius:99px;background:none;cursor:pointer;color:rgba(245,245,243,.72);font-size:15px;white-space:nowrap;transition:color .3s}
.dock-btn.active{color:#000}
.dock-btn:focus-visible{outline:2px solid #F5F5F3;outline-offset:-2px}
.dock-btn .s{display:none}
.dock-ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:99px;background:#FAFAF8}
@media(max-width:640px){.dock-btn{padding:10px 11px;font-size:14px}.dock-btn .l{display:none}.dock-btn .s{display:inline}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wordmark">Gastos</div>
  <div class="who">Pedro Jota</div>
</header>
<main class="main">
  <section id="page-maio" class="page"></section>
  <section id="page-junho" class="page"></section>
  <section id="page-julho" class="page"></section>
  <section id="page-agosto" class="page"></section>
  <section id="page-graficos" class="page"></section>
  <section id="page-historico" class="page"></section>
</main>
<nav class="dock" aria-label="Seções">
  <div class="dock-in">
    <span class="dock-ind" aria-hidden="true"></span>
    <button class="dock-btn press" onclick="showTab('maio')" id="tab-maio"><span class="l">Maio</span><span class="s">Mai</span></button>
    <button class="dock-btn press" onclick="showTab('junho')" id="tab-junho"><span class="l">Junho</span><span class="s">Jun</span></button>
    <button class="dock-btn press" onclick="showTab('julho')" id="tab-julho"><span class="l">Julho</span><span class="s">Jul</span></button>
    <button class="dock-btn press" onclick="showTab('agosto')" id="tab-agosto"><span class="l">Agosto</span><span class="s">Ago</span></button>
    <button class="dock-btn press" onclick="showTab('graficos')" id="tab-graficos"><span class="l">Gráficos</span><span class="s">Gráficos</span></button>
    <button class="dock-btn press" onclick="showTab('historico')" id="tab-historico"><span class="l">Histórico</span><span class="s">Histórico</span></button>
  </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script>
/* ── Motion (versão vanilla do Framer Motion) ── */
const M=window.Motion||null;
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const EASE=[.16,1,.3,1];
const still=()=>!M||RM.matches;
function tween(from,to,o,cb){if(still()){cb(to);return null;}return M.animate(from,to,{duration:.9,ease:EASE,...o,onUpdate:cb});}

const $=id=>document.getElementById(id);
const fBR=n=>n==null?'—':'R$ '+Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pBR=s=>typeof s==='number'?s:parseFloat(String(s).replace(/\./g,'').replace(',','.'))||0;
const fInt=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const fDec=n=>Number(n).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctS=v=>isFinite(v)?Math.round(v*100)+'%':'—';
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const low1=s=>s.charAt(0).toLowerCase()+s.slice(1);
const listPT=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];

function moneyHTML(n,dec=true){
  const [i,d]=Math.abs(n).toFixed(2).split('.');
  return`<span class="m-cur">${n<-.004?'–':''}R$</span>${Number(i).toLocaleString('pt-BR')}${dec?`<span class="m-dec">,${d}</span>`:''}`;
}
function setMoney(el,v,dec=true){
  if(!el)return;const from=el.dataset.v!=null?+el.dataset.v:0;el.dataset.v=v;
  el._tw?.stop?.();el._tw=tween(from,v,{duration:1.15},x=>el.innerHTML=moneyHTML(x,dec));
}
function setPct(el,v){
  if(!el)return;const from=el.dataset.v!=null?+el.dataset.v:0;el.dataset.v=v;
  el._tw?.stop?.();el._tw=tween(from,v,{duration:1},x=>el.innerHTML=`${Math.round(x)}<span class="pct">%</span>`);
}
/* variação: kind 'gasto' (subir é ruim) ou 'ganho' (subir é bom) */
function dchip(d,kind){
  if(Math.abs(d)<.005)return'';const up=d>0,good=kind==='ganho'?up:!up;
  return`<span class="dc ${good?'pos':'neg'}"><i class="tri ${up?'up':'dn'}" aria-hidden="true"></i><span class="sr">${up?'aumentou':'diminuiu'} </span>${fDec(Math.abs(d))}</span>`;
}
function deltaHTML(d,kind,ref){
  if(!ref)return'<span class="neu">Primeiro mês registrado</span>';
  if(Math.abs(d)<.005)return`<span class="neu">Igual a ${ref}</span>`;

const NS='http://www.w3.org/2000/svg';
function S(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;}
const INK='#F4F4F2',MIST='#8E979C',SLATE='#4C5358',POS_I='#4BD69B',NEG_I='#FF6F70';
function patterns(svg,p){
  const d=S('defs',{},svg);
  const pat=(id,rot,draw)=>{const at={id:p+'-'+id,width:5,height:5,patternUnits:'userSpaceOnUse'};if(rot!=null)at.patternTransform=`rotate(${rot})`;draw(S('pattern',at,d));};
  pat('hatch',45,pt=>S('rect',{width:1.6,height:5,fill:INK},pt));
  pat('dots',null,pt=>S('circle',{cx:2.5,cy:2.5,r:1.1,fill:INK},pt));
  pat('grid',45,pt=>{S('rect',{width:1.1,height:5,fill:INK},pt);S('rect',{width:5,height:1.1,fill:INK},pt);});
  pat('hatchr',-45,pt=>S('rect',{width:1.6,height:5,fill:MIST},pt));
  return d;
}
const FILLS=p=>[INK,MIST,`url(#${p}-hatch)`,`url(#${p}-dots)`,SLATE,`url(#${p}-grid)`,`url(#${p}-hatchr)`,'#2A2E31'];
const SWATCH=[INK,MIST,'repeating-linear-gradient(45deg,#F4F4F2 0 1.6px,transparent 1.6px 3.6px)','radial-gradient(circle,#F4F4F2 1.1px,transparent 1.5px) 0 0/5px 5px',SLATE,'repeating-linear-gradient(45deg,#F4F4F2 0 1.1px,transparent 1.1px 3.6px),repeating-linear-gradient(-45deg,#F4F4F2 0 1.1px,transparent 1.1px 3.6px)','repeating-linear-gradient(-45deg,#8E979C 0 1.6px,transparent 1.6px 3.6px)','#2A2E31'];

const CHARTS=new Map();
function regChart(id,draw){const el=$(id);if(!el)return;CHARTS.set(id,draw);el._w=el.clientWidth;draw(true);}
function refreshCharts(scope){CHARTS.forEach((draw,id)=>{const el=$(id);if(!el||!el.isConnected||el.offsetParent===null)return;if(scope&&!scope.contains(el))return;if(el._w!==el.clientWidth){el._w=el.clientWidth;draw(false);}});}

const SHORT={'Comida e bebida':'Comida','Lazer e entretenimento':'Lazer','Viagem e hospedagem':'Viagem','Ferramentas de trabalho':'Trabalho','Mobilidade urbana':'Mobilidade','Compras online':'Compras','Locação de carros':'Locação'};
const shortCat=n=>SHORT[n]||n;
function arcD(cx,cy,r,a){
  if(a<=.05)return'';const s=-Math.PI/2,e=(a-90)*Math.PI/180;
  return`M${(cx+r*Math.cos(s)).toFixed(2)} ${(cy+r*Math.sin(s)).toFixed(2)}A${r} ${r} 0 ${a>180?1:0} 1 ${(cx+r*Math.cos(e)).toFixed(2)} ${(cy+r*Math.sin(e)).toFixed(2)}`;
}
function pieRings(cats){
  const s=[...cats].sort((a,b)=>b.total-a.total);
  if(s.length<=8)return s.map(c=>({nome:c.nome,total:c.total,members:[c.nome]}));
  const rest=s.slice(7);
  return[...s.slice(0,7).map(c=>({nome:c.nome,total:c.total,members:[c.nome]})),{nome:'Demais',total:rest.reduce((t,c)=>t+c.total,0),members:rest.map(c=>c.nome)}];
}
/* anéis concêntricos: cada categoria um anel, o maior ocupa 270° */
function buildPie(hid,lid,cats){
  const host=$(hid),total=cats.reduce((s,c)=>s+c.total,0),rings=pieRings(cats),max=Math.max(...rings.map(r=>r.total));
  regChart(hid,animate=>{
    host.innerHTML='';
    const svg=S('svg',{viewBox:'0 0 320 320',role:'img','aria-label':'Distribuição da fatura por categoria: '+rings.map(r=>`${r.nome} ${pctS(r.total/total)}`).join(', ')},host);
    patterns(svg,hid);const F=FILLS(hid),c=160,rw=11.5,gap=5,R=i=>150-rw/2-i*(rw+gap);
    rings.forEach((rg,i)=>{
      const r=R(i);S('circle',{cx:c,cy:c,r,fill:'none',stroke:'rgba(255,255,255,.1)','stroke-width':1},svg);
      const path=S('path',{fill:'none',stroke:F[i],'stroke-width':rw},svg),ang=rg.total/max*270;
      if(animate)tween(0,ang,{duration:1.4,delay:.3+i*.08},a=>path.setAttribute('d',arcD(c,c,r,a)));else path.setAttribute('d',arcD(c,c,r,ang));
    });
    rings.forEach((rg,i)=>{
      const r=R(i),txt=`${shortCat(rg.nome)} ${pctS(rg.total/total)}`,w=txt.length*5.9+10;
      S('rect',{x:c-9-w+5,y:c-r-7,width:w,height:14,fill:'#000',rx:2},svg);
      S('text',{x:c-9,y:c-r+3.6,'text-anchor':'end','font-size':10.5,fill:'rgba(245,245,243,.9)','letter-spacing':'.02em'},svg).textContent=txt;
    });
    S('circle',{cx:c,cy:c,r:2.5,fill:INK},svg);
  });
  $(lid).innerHTML=rings.map((rg,i)=>`<div class="leg-i"><span class="swp" style="background:${SWATCH[i]}"></span><span class="n" title="${rg.members.join(', ')}">${rg.nome}</span><span class="p">${pctS(rg.total/total)}</span></div>`).join('');
}

let barMode='grouped';
const mesCurto=m=>m.split(' ')[0];
function barGeom(W,H,mode){
  const pt=48,pb=46,ph=H-pt-pb,base=pt+ph,n=MESES_G.length,slot=W/n,stacked=mode==='stacked';
  const max=stacked?Math.max(...MESES_G.map(m=>m.df+m.ct)):Math.max(...MESES_G.flatMap(m=>[m.df,m.ct]));
  const rects=[],tot=[];
  MESES_G.forEach((m,i)=>{
    const hd=m.df/max*ph,hc=m.ct/max*ph;
    if(stacked){const bw=Math.min(76,slot*.46),x=slot*i+(slot-bw)/2;rects.push({x,y:base-hd,w:bw,h:hd},{x,y:base-hd-hc-3,w:bw,h:hc});tot.push({x:x+bw/2,y:base-hd-hc-17});}
    else{const bw=Math.min(46,slot*.27),g=6,x=slot*i+(slot-2*bw-g)/2;rects.push({x,y:base-hd,w:bw,h:hd},{x:x+bw+g,y:base-hc,w:bw,h:hc});tot.push({x:x+bw+g/2,y:base-Math.max(hd,hc)-14});}
  });
  return{rects,tot,base,slot};
}
function setRect(el,r){el.setAttribute('x',r.x);el.setAttribute('y',r.y);el.setAttribute('width',r.w);el.setAttribute('height',Math.max(r.h,0));el._g=r;}

function setBarMode(m){

function smooth(p){
  let d=`M${p[0][0]} ${p[0][1]}`;
  for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2,t=.18;d+=`C${p1[0]+(p2[0]-p0[0])*t} ${p1[1]+(p2[1]-p0[1])*t} ${p2[0]-(p3[0]-p1[0])*t} ${p2[1]-(p3[1]-p1[1])*t} ${p2[0]} ${p2[1]}`;}
  return d;
}

    const area=S('path',{d:`${smooth(pts)}L${pts.at(-1)[0]} ${y0}L${pts[0][0]} ${y0}Z`,fill:`url(#${hid}-ag)`,opacity:animate?0:1},svg);
    const line=S('path',{d:smooth(pts),fill:'none',stroke:INK,'stroke-width':2},svg);
    if(animate){const L=line.getTotalLength();line.setAttribute('stroke-dasharray',L);line.setAttribute('stroke-dashoffset',L);tween(L,0,{duration:1.6,delay:.3},v=>line.setAttribute('stroke-dashoffset',v));tween(0,1,{duration:1.2,delay:.9},v=>area.setAttribute('opacity',v));}
    pts.forEach(([x,y],i)=>{
      const g=S('g',{opacity:animate?0:1},svg),v=vals[i];
      S('circle',{cx:x,cy:y,r:6,fill:'#000',stroke:v>=0?POS_I:NEG_I,'stroke-width':2},g);
      S('text',{x,y:v>=0?y-16:y+26,'text-anchor':'middle','font-size':14,fill:'rgba(245,245,243,.9)'},g).textContent=fInt(v).replace('R$ -','–R$ ');
      if(animate)tween(0,1,{duration:.6,delay:.4+i*(1.2/pts.length)},o=>g.setAttribute('opacity',o));
      S('text',{x,y:H-pb+32,'text-anchor':'middle','font-size':15,fill:'rgba(245,245,243,.7)'},svg).textContent=mesCurto(h[i].mes);
    });
  });
}
function buildHist(){
  const pg=document.getElementById('page-historico');pg.dataset.built='1';
  const h=MESES_CFG.map(c=>({mes:c.label,fields:cfgFields(c)}));
  const rows=h.map((e,i)=>{const c=calc(e.fields);const d=i>0?dchip(c.sobrou-calc(h[i-1].fields).sobrou,'ganho'):'';return`<tr><td>${e.mes}</td><td>${fBR(c.tot)}</td><td>${fBR(c.desp)}</td><td>${fBR(e.fields.cartao)}</td><td><span class="sob">${d}<span class="pill ${c.sobrou>=0?'pos':'neg'}">${fBR(c.sobrou)}</span></span></td></tr>`;}).join('');
  pg.innerHTML=dispHtml('Histórico','Todos os meses, do mais antigo ao mais recente.')+'<div class="bento">'
    +(h.length>=2?`<article class="c c-b grad s12">${glow()}<div class="ch"><div><h2>Quanto sobrou a cada mês</h2><p class="sub">Receitas menos despesas fixas e fatura do cartão.</p></div></div><div class="chart" id="hist-chart"></div></article>`:'')
    +`<article class="c c-w s12"><div class="ch"><div><h2>Meses</h2><p class="sub">${h.length} ${h.length>1?'meses':'mês'}. A variação compara o que sobrou com o mês anterior.</p></div></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas fixas</th><th>Cartão</th><th>Sobrou</th></tr></thead><tbody>${rows}</tbody></table></div></article></div>`;
  if(h.length>=2)buildHistChart('hist-chart',h);
}

/* abrir no mês mais recente */
showTab(MESES_CFG.at(-1).key);
moveDock(true);
document.fonts?.ready.then(()=>{moveDock(true);moveSeg(true);});
</script>
